# Options
set -g mouse off
set -g status-position top
set -sg escape-time 1
set -g mode-keys vi
set -s copy-command 'wl-copy'
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-features ",xterm-kitty:hyperlinks"
set -g focus-events on
setw -g main-pane-height 75%
set -g base-index 1
setw -g pane-base-index 1
set -g focus-events on
set -g status-interval 1

# Keybindings
## Rebind Pane navigation
unbind Left
unbind h
bind h select-pane -L
unbind Down
unbind j
bind j select-pane -D
unbind Up
unbind k
bind k select-pane -U
unbind Right
unbind l
bind l select-pane -R
## Rebind Window navigation
unbind \;
bind \; select-window -l
## Rebind Window splitting
unbind %
bind % split-window -h -c "#{pane_current_path}"
unbind '"'
bind '"' split-window -v -c "#{pane_current_path}"
## Rebind reload
bind r source-file ~/.config/tmux/tmux.conf
## Others
### Popup
unbind f
bind f popup
unbind F
bind F popup -E "$SHELL"
unbind C-s
bind C-s display-popup -E "tmux new-session -A -s shared"

# Plugin Manager
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.local/share/tmux/plugins'

source-file ~/.config/tmux/theme.tmux

set -g @plugin 'tmux-plugins/tpm'
# TPM Auto Installation
if-shell "test ! -d  #{TMUX_PLUGIN_MANAGER_PATH}/tpm" \
	"run 'git clone https://github.com/tmux-plugins/tpm #{TMUX_PLUGIN_MANAGER_PATH}/tpm && #{TMUX_PLUGIN_MANAGER_PATH}/tpm/bin/install_plugins'"
run-shell '#{TMUX_PLUGIN_MANAGER_PATH}/tpm/tpm'
