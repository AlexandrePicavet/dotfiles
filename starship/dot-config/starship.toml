'$schema' = 'https://starship.rs/config-schema.json'

palette = 'catppuccin_macchiato'

format = '''
$git_state$git_branch $git_commit$git_status$fill$java$maven$nodejs$rust$dart$cmd_duration$kubernetes$memory_usage
$username$nix_shell$directory $character
'''

[character]
success_symbol = '[❯](green)'
error_symbol = '[❯](red)'
vimcmd_symbol = '[❮](yellow)'

[directory]
format = '[$read_only]($read_only_style)󰉋 [$path]($style)'
home_symbol = ''
read_only = ' '
truncation_length = 4
truncate_to_repo = true
truncation_symbol = '󰇘/'
style = 'bold lavender'

[username]
style_user = 'green'
style_root = 'bold red'
format = '[ $user]($style) '
disabled = false

[fill]
symbol = '⋅'
style = 'bold surface0'

[line_break]
disabled = true

[cmd_duration]
disabled = false
min_time = 1_500
show_milliseconds = true
format = '[ $duration]($style) '

[git_branch]
format = '[$symbol$branch(:$remote_branch)]($style)'

[git_commit]
tag_disabled = false
tag_symbol = '  '

[git_metrics]
disabled = false

[git_status]
disabled = false
format = '$stashed$conflicted$ahead_behind$staged$modified$renamed$deleted$untracked'
stashed = '[*$count](lavender) '
conflicted = '[󰡌 $count](red) '
ahead = '[⇡$count](yellow) '
diverged = '[⇕⇡$ahead_count⇣$behind_count](yellow) '
behind = '[⇣$count](yellow) '
staged = '[+$count](green) '
modified = '[!$count](peach) '
renamed = '[»$count](blue) '
deleted = '[✘$count](maroon) '
untracked = '[?$count](subtext0) '

[kubernetes]
disabled = false
symbol = '⎈ '
format = '[$symbol$context (\($namespace\))]($style) '

[memory_usage]
disabled = false
format = '[ ${ram} | 󰣁 ${swap}]($style) '
threshold = -1
symbol = ''
style = 'overlay0'

[nix_shell]
format = '[$state]($style) '
impure_msg = '[](bold red)'
pure_msg = '[](bold blue)'

[maven]
format = '[$symbol($version)]($style) '

[java]
format = '[$symbol($version)]($style) '

[nodejs]
format = '[$symbol($version$engines_version)]($style) '

[rust]
format = '[$symbol($version)]($style) '

[dart]
format = '[$symbol($version)]($style) '

