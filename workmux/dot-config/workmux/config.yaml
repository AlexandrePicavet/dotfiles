merge_keep: true
merge_strategy: merge

nerdfont: true

window_placement: rightmost

worktree_dir: ".." # Use in bare repositories
worktree_naming: full

mode: window

agent: vibe

agents:
  claude:
    type: claude
    command: sh
    args:
      - -c
      - ~/.config/workmux/scripts/agent-wrapper.sh
    env:
      WORKMUX_AGENT: claude
  opencode:
    type: opencode
    command: sh
    args:
      - -c
      - ~/.config/workmux/scripts/agent-wrapper.sh
    env:
      WORKMUX_AGENT: opencode
  pi:
    type: pi
    command: sh
    args:
      - -c
      - ~/.config/workmux/scripts/agent-wrapper.sh
    env:
      WORKMUX_AGENT: pi
  vibe:
    type: vibe
    command: sh
    args:
      - -c
      - ~/.config/workmux/scripts/agent-wrapper.sh
    env:
      WORKMUX_AGENT: vibe


panes:
  - name: nvim
    command: nvim
  - name: shell
    split: vertical
    percentage: 25
  - name: agent
    command: <agent>
    focus: true
    split: horizontal
    target: 0
    percentage: 65

layouts:
  research:
    panes:
      - command: <agent>
        focus: true
